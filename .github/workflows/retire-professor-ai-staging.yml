name: Retire professor AI staging branch

on:
  push:
    branches:
      - install/all-2026-09-12
    paths:
      - '.github/workflows/retire-professor-ai-staging.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary professor AI branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/ai/professor-architecture-2026-09-15'
              });
              core.info('Deleted ai/professor-architecture-2026-09-15');
            } catch (error) {
              if (error.status === 404) {
                core.info('Temporary branch already absent');
              } else {
                throw error;
              }
            }
