name: Black Box Companion tests

on:
  push:
    branches:
      - install/all-2026-09-12
      - 'blackbox/**'
    paths:
      - 'VRAnalytics.cpp'
      - 'VRAnalytics.h'
      - 'TacticalAI/AIUtils.cpp'
      - 'Strategic/Strategic AI.cpp'
      - 'tools/vr_companion_analyze.py'
      - 'tools/test_vr_companion.py'
      - 'COLLECT_BLACKBOX.ps1'
      - '.github/workflows/blackbox-companion-test.yml'
  workflow_dispatch:

jobs:
  companion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Companion scripts
        run: |
          python -m py_compile tools/vr_companion_analyze.py
          python -m py_compile tools/test_vr_companion.py

      - name: Parse Black Box collector PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'COLLECT_BLACKBOX.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'PowerShell syntax errors in COLLECT_BLACKBOX.ps1'
          }

      - name: Smoke-test Black Box evidence collector
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP 'blackbox-collector-game'
          $out = Join-Path $env:RUNNER_TEMP 'blackbox-collector-out'
          $expanded = Join-Path $env:RUNNER_TEMP 'blackbox-collector-expanded'
          Remove-Item $game, $out, $expanded -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $game, $out | Out-Null
          @(
            '[00:00:01.000] [ENGINE] synthetic smoke test',
            '[00:00:02.000] [ENGINE] Clean shutdown'
          ) | Set-Content -LiteralPath (Join-Path $game 'BlackBox_LastRun.log') -Encoding UTF8
          '{"schema":"vr-blackbox-1","session":1,"seq":1,"kind":"session_start"}' |
            Set-Content -LiteralPath (Join-Path $game 'VR_BlackBox.jsonl') -Encoding UTF8

          & (Join-Path $env:GITHUB_WORKSPACE 'COLLECT_BLACKBOX.ps1') -GameRoot $game -OutputDirectory $out

          $zip = Get-ChildItem -LiteralPath $out -Filter 'Vengeance_BlackBox_*.zip' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $zip) { throw 'Collector did not create a ZIP.' }

          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded -Force
          foreach ($required in @('manifest.csv', 'environment.txt', 'BlackBox_LastRun.log', 'VR_BlackBox.jsonl')) {
            if (-not (Test-Path -LiteralPath (Join-Path $expanded $required) -PathType Leaf)) {
              throw "Collector ZIP is missing required file: $required"
            }
          }

          $manifest = Import-Csv -LiteralPath (Join-Path $expanded 'manifest.csv')
          if (-not ($manifest.RelativePath -contains 'BlackBox_LastRun.log')) {
            throw 'Manifest does not contain BlackBox_LastRun.log.'
          }

      - name: Compile logger as C++03
        run: g++ -std=c++03 -Wall -Wextra -pedantic -c VRAnalytics.cpp -o /tmp/VRAnalytics.o

      - name: End-to-end Black Box smoke test
        shell: bash
        run: |
          cat > /tmp/vr_blackbox_smoke.cpp <<'CPP'
          #include "VRAnalytics.h"
          int main()
          {
              VRAnalyticsBattleStarted(100, 1, 1, 0, 6, 10, 0);
              VRAnalyticsTacticalRetreatAssessment(
                  1, 1, 2, 600, 300, 3, 35, 20, 72, 18, 20, 60, 10, 0,
                  false, 4, true, true, true, false, 90, 82, 6, 35, 18,
                  true, false, false);
              VRAnalyticsTacticalFormationSnapshot(1, 1, 1, 1, 0, 10, 8, 0, 1, 0, 1, 20, 3, 18);
              VRAnalyticsTacticalCandidate(1, "hold_ground", 1200, 72, 72, true, "smoke_test");
              VRAnalyticsTacticalCandidate(1, "sector_escape", 1200, 28, 35, false, "hold_confidence_high");
              VRAnalyticsTacticalCandidate(1, "attack_option", 1234, 55, 70, true, "smoke_test");
              VRAnalyticsTacticalDecisionSelected(1, 1, 4, 1234, 1200, 25, 90, 80, 3, 2, 5, 1);
              VRAnalyticsTacticalActionDone(1, 4, 1201, 17, 90, 77, true);
              unsigned long d = VRAnalyticsBeginDecision(VR_ANALYTICS_STRATEGIC, "queen", 0, "smoke_strategy");
              VRAnalyticsStateInt(d, "request_points", 20);
              VRAnalyticsCandidate(d, "reinforce_garrison", 17, 40, 40, true, "eligible");
              VRAnalyticsCommitDecision(d, "reinforce_garrison", 17, 40, "weighted_selection");
              VRAnalyticsOutcome(d, "completed", "troops", 8, "travel_minutes", 60, "smoke_test");
              VRAnalyticsStrategicMoveOrdered(110, 7, 0, 17, 8, 0, 0);
              VRAnalyticsStrategicGroupArrived(170, 7, 17, 8, "garrison_reinforcement");
              VRAnalyticsBattleEnded("victory", 200, 1, 1, 0, 6, 0, 0, false);
              return 0;
          }
          CPP
          rm -f VR_BlackBox.jsonl VR_Companion_Report.md VR_Companion_Summary.json
          g++ -std=c++03 -I. VRAnalytics.cpp /tmp/vr_blackbox_smoke.cpp -o /tmp/vr_blackbox_smoke
          /tmp/vr_blackbox_smoke
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("VR_BlackBox.jsonl")
          assert p.exists() and p.stat().st_size > 0
          events = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert any(e.get("kind") == "session_start" and e.get("blackbox_version") == 2 for e in events)
          assert any(e.get("kind") == "battle_start" for e in events)
          assert any(e.get("kind") == "formation_snapshot" for e in events)
          assert any(
              e.get("kind") == "assessment"
              and e.get("assessment_type") == "retreat_courage"
              and e.get("hold_confidence") == 72
              and e.get("perceived_friendly_strength") == 600
              and e.get("perceived_enemy_strength") == 300
              for e in events
          )
          assert any(e.get("kind") == "candidate" and e.get("candidate") == "sector_escape" for e in events)
          assert any(e.get("kind") == "decision_commit" for e in events)
          assert any(e.get("kind") == "strategic_move_order" for e in events)
          assert any(e.get("kind") == "strategic_group_arrived" for e in events)
          assert any(e.get("kind") == "battle_end" for e in events)
          print(f"Parsed {len(events)} Black Box events")
          PY
          python tools/vr_companion_analyze.py VR_BlackBox.jsonl
          test -s VR_Companion_Report.md
          test -s VR_Companion_Summary.json

      - name: Run Companion unit tests
        working-directory: tools
        run: python -m unittest -v test_vr_companion.py
