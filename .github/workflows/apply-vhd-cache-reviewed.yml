name: Apply reviewed VHD cache modernization

on:
  push:
    branches:
      - engine/vhd-modernization-2026
    paths:
      - '.automation/vhd-cache-reviewed.trigger'

permissions:
  contents: write

concurrency:
  group: apply-vhd-cache-reviewed
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: engine/vhd-modernization-2026
          fetch-depth: 80

      - name: Integrate reviewed cache slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags --depth=100 origin engine/vhd-cache-modernization-2026-09-15

          for commit in \
            3fe91cd450 \
            d979c0190f \
            e3472cb20f \
            0143730fdb \
            5c7b5a6a54 \
            fa8d2a055b \
            0d0d16c6c0
          do
            git cherry-pick "$commit"
          done

          python - <<'PY'
          from pathlib import Path

          p = Path("TileEngine/Tile Cache.cpp")
          s = p.read_text(encoding="utf-8")

          old_budget = """static void InitTileCacheBudget( )
          {
          \tconst CHAR8 *pBudgetMB = getenv( "VR_VHD_TILE_CACHE_MB" );
          \tif ( pBudgetMB != NULL && pBudgetMB[0] != 0 )
          \t{
          \t\tunsigned long ulBudgetMB = strtoul( pBudgetMB, NULL, 10 );
          \t\tif ( ulBudgetMB < 16 ) ulBudgetMB = 16;
          \t\tif ( ulBudgetMB > 1024 ) ulBudgetMB = 1024;
          \t\tguiTileCacheBudgetBytes = (UINT32)ulBudgetMB * 1024u * 1024u;
          \t}
          }
          """
          new_budget = """static void InitTileCacheBudget( )
          {
          \tconst UINT32 uiDefaultBudgetMB = 128u;
          \tconst UINT32 uiMinBudgetMB = 16u;
          \tconst UINT32 uiMaxBudgetMB = 512u; // Win32/non-LAA: preserve process address-space headroom.
          \tUINT32 uiBudgetMB = uiDefaultBudgetMB;

          \tconst CHAR8 *pBudgetMB = getenv( "VR_VHD_TILE_CACHE_MB" );
          \tif ( pBudgetMB != NULL && pBudgetMB[0] != 0 )
          \t{
          \t\tCHAR8 *pEnd = NULL;
          \t\tconst unsigned long ulParsed = strtoul( pBudgetMB, &pEnd, 10 );
          \t\tif ( pEnd != pBudgetMB && pEnd != NULL && *pEnd == 0 )
          \t\t{
          \t\t\tif ( ulParsed < uiMinBudgetMB )
          \t\t\t\tuiBudgetMB = uiMinBudgetMB;
          \t\t\telse if ( ulParsed > uiMaxBudgetMB )
          \t\t\t\tuiBudgetMB = uiMaxBudgetMB;
          \t\t\telse
          \t\t\t\tuiBudgetMB = (UINT32)ulParsed;
          \t\t}
          \t}
          \tguiTileCacheBudgetBytes = uiBudgetMB * 1024u * 1024u;
          }
          """
          if old_budget not in s:
              raise SystemExit("Expected original tile-cache budget block not found")
          s = s.replace(old_budget, new_budget, 1)

          old_cleanup = """\t\tMemFree( gpTileCache );
          \t}

          \tif ( gpTileCacheStructInfo != NULL )
          \t{
          \t\tMemFree( gpTileCacheStructInfo );
          \t}

          \tguiCurTileCacheSize = 0;
          \tguiTileCacheResidentBytes = 0;
          \tguiTileCachePeakBytes = 0;
          """
          new_cleanup = """\t\tMemFree( gpTileCache );
          \t\tgpTileCache = NULL;
          \t}

          \tif ( gpTileCacheStructInfo != NULL )
          \t{
          \t\tMemFree( gpTileCacheStructInfo );
          \t\tgpTileCacheStructInfo = NULL;
          \t}

          \tguiCurTileCacheSize = 0;
          \tguiNumTileCacheStructs = 0;
          \tgiDefaultStructIndex = -1;
          \tguiTileCacheResidentBytes = 0;
          \tguiTileCachePeakBytes = 0;
          """
          if old_cleanup not in s:
              raise SystemExit("Expected tile-cache shutdown block not found")
          s = s.replace(old_cleanup, new_cleanup, 1)

          p.write_text(s, encoding="utf-8")
          PY

          git add "TileEngine/Tile Cache.cpp"
          git diff --cached --check
          git commit -m "VHD cache: harden Win32 budget and shutdown state"

          git rm .automation/vhd-cache-reviewed.trigger
          git commit -m "Automation: clear reviewed VHD cache trigger"
          git push origin HEAD:engine/vhd-modernization-2026
