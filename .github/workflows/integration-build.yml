name: Vengeance integration build

on:
  push:
    branches:
      - install/all-2026-09-12
      - 'blackbox/**'
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.vcxproj'
      - '**/*.props'
      - '*.sln'
      - 'DEPLOY_*.ps1'
      - 'GENERATE_VR_BUILD_INFO.ps1'
      - 'Tools/AI/**'
      - 'UNIFIED_AI_FRAMEWORK.md'
      - 'TacticalAI/AI_SUBSYSTEM_MAP.md'
      - 'Strategic/STRATEGIC_AI_STAGING_MANIFEST.md'
      - '.github/workflows/integration-build.yml'
  workflow_dispatch:

concurrency:
  group: ja2-render-shared
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 30

    steps:
      - name: Check out integrated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20

      - name: Parse deployment and AI audit PowerShell
        shell: powershell
        run: |
          $scripts = @(
            Get-ChildItem $env:GITHUB_WORKSPACE -Filter 'DEPLOY_*.ps1' -File
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'Tools\AI') -Filter '*.ps1' -File
          )
          $scripts | ForEach-Object {
            Write-Host "Parsing $($_.FullName)"
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax errors in $($_.FullName)"
            }
          }

      - name: Verify unified AI source integrity
        shell: powershell
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'Tools\AI\VERIFY_AI_INTEGRITY.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw 'MSBuild could not be found on the self-hosted runner.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using MSBuild: $msbuild"

      - name: Build Vengeance Release Win32
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2 /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\JA2_EN_Release.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not built: $exe"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "Build OK: $exe"
          Write-Host "SHA256: $hash"
