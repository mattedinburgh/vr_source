name: Vengeance integration build

on:
  push:
    branches:
      - install/all-2026-09-12
    paths:
      - 'GameVersion.h'
      - 'SaveLoadGame.cpp'
      - 'Tactical/**'
      - 'TacticalAI/**'
      - 'Strategic/**'
      - 'TileEngine/**'
      - 'Standard Gaming Platform/**'
      - 'DEPLOY_*.ps1'
      - '.github/workflows/integration-build.yml'
  workflow_dispatch:

concurrency:
  group: vengeance-integration-build
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 30

    steps:
      - name: Check out integrated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Parse deployment PowerShell
        shell: powershell
        run: |
          Get-ChildItem $env:GITHUB_WORKSPACE -Filter 'DEPLOY_*.ps1' -File | ForEach-Object {
            Write-Host "Parsing $($_.Name)"
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax errors in $($_.Name)"
            }
          }

      - name: Retarget VS2013 projects to installed v120 toolset
        shell: powershell
        run: |
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.vcxproj' -File | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            $newText = $text.Replace(
              '<PlatformToolset>v120_xp</PlatformToolset>',
              '<PlatformToolset>v120</PlatformToolset>'
            )
            if ($newText -ne $text) {
              [System.IO.File]::WriteAllText(
                $path,
                $newText,
                (New-Object System.Text.UTF8Encoding($false))
              )
            }
          }

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw 'MSBuild could not be found on the self-hosted runner.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using MSBuild: $msbuild"

      - name: Build Vengeance Release Win32
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2 /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\JA2_EN_Release.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not built: $exe"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "Build OK: $exe"
          Write-Host "SHA256: $hash"
