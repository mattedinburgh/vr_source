name: Normalize VHD cache line endings

on:
  push:
    branches:
      - engine/vhd-modernization-2026
    paths:
      - '.automation/vhd-cache-eol.trigger'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: engine/vhd-modernization-2026
          fetch-depth: 20

      - name: Restore CRLF in Tile Cache.cpp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("TileEngine/Tile Cache.cpp")
          data = p.read_bytes()
          text = data.decode("utf-8").replace("\r\n", "\n").replace("\r", "\n")
          p.write_bytes(text.replace("\n", "\r\n").encode("utf-8"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          data = Path("TileEngine/Tile Cache.cpp").read_bytes()
          if b"\r\n" not in data:
              raise SystemExit("CRLF verification failed: no CRLF sequences present")
          if data.replace(b"\r\n", b"").find(b"\n") != -1:
              raise SystemExit("CRLF verification failed: bare LF remains")
          print("CRLF byte verification passed.")
          PY
          git add "TileEngine/Tile Cache.cpp"
          git commit -m "VHD cache: restore canonical CRLF line endings"
          git rm .automation/vhd-cache-eol.trigger
          git commit -m "Automation: clear VHD cache EOL trigger"
          git push origin HEAD:engine/vhd-modernization-2026
