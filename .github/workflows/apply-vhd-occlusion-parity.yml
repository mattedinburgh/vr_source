name: Apply VHD occlusion parity candidate

on:
  push:
    branches:
      - engine/vhd-occlusion-parity-2026
    paths:
      - '.automation/vhd-occlusion-parity.trigger'

permissions:
  contents: write

concurrency:
  group: apply-vhd-occlusion-parity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out parity branch
        uses: actions/checkout@v4
        with:
          ref: engine/vhd-occlusion-parity-2026
          fetch-depth: 20

      - name: Apply corrected compositor patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .automation/vhd-occlusion-parity.patch
          git apply .automation/vhd-occlusion-parity.patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TileEngine/renderworld.cpp
          git rm .automation/vhd-occlusion-parity.patch
          git rm .automation/vhd-occlusion-parity.trigger
          git diff --cached --check
          git commit -m "VHD occlusion: preserve legacy mask in one-pass compositor"
          git push origin HEAD:engine/vhd-occlusion-parity-2026
