name: A3 tile art inspection

on:
  push:
    branches:
      - install/all-2026-09-12
    paths:
      - '.github/workflows/a3-tile-art-inspection.yml'
  workflow_dispatch:

concurrency:
  group: ja2-render-shared
  cancel-in-progress: false

jobs:
  inspect-a3-art:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 10

    steps:
      - name: Check out vr_source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Locate Git
        id: git
        shell: powershell
        run: |
          $git = $null
          $cmd = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($cmd) { $git = $cmd.Source }
          if (-not $git) {
            $git = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Recurse -Filter git.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\resources\\app\\git\\cmd\\git\.exe$' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $git) { throw 'Git not found.' }
          "path=$git" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Fetch A3 tileset assets
        shell: powershell
        run: |
          $git = '${{ steps.git.outputs.path }}'
          $gamedir = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir'
          if (Test-Path $gamedir) { Remove-Item -Recurse -Force $gamedir }
          & $git -c core.longpaths=true clone --depth 1 --single-branch --branch install/all-2026-09-12 --filter=blob:none --no-checkout https://github.com/mattedinburgh/vr_gamedir.git $gamedir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $gamedir sparse-checkout init --cone
          & $git -C $gamedir sparse-checkout set Data-Maps-Tiles/Tilesets/38
          & $git -C $gamedir checkout install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Decode A3 B1TC families to contact sheets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing

          function Read-U16([byte[]]$b, [int]$o) {
            return [System.BitConverter]::ToUInt16($b, $o)
          }
          function Read-I16([byte[]]$b, [int]$o) {
            return [System.BitConverter]::ToInt16($b, $o)
          }
          function Read-U32([byte[]]$b, [int]$o) {
            return [System.BitConverter]::ToUInt32($b, $o)
          }

          function Decode-B1TC([string]$Path, [string]$OutPng, [string]$OutJson) {
            [byte[]]$b = [System.IO.File]::ReadAllBytes($Path)
            if ([System.Text.Encoding]::ASCII.GetString($b,0,4) -ne 'B1TC') { throw "Bad magic: $Path" }
            $version = Read-U16 $b 4
            $count = Read-U16 $b 6
            if ($version -ne 1 -or $count -lt 1) { throw "Unsupported B1TC: $Path" }

            $frames = @()
            $cellW = 220
            $cellH = 180
            $cols = 4
            $rows = [Math]::Ceiling($count / [double]$cols)
            $sheet = New-Object System.Drawing.Bitmap ($cols * $cellW), ([int]$rows * $cellH), ([System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [System.Drawing.Graphics]::FromImage($sheet)
            $g.Clear([System.Drawing.Color]::FromArgb(255,36,36,36))
            $font = New-Object System.Drawing.Font 'Consolas', 9
            $brush = [System.Drawing.Brushes]::White
            $gridPen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(255,90,90,90))

            try {
              for ($i=0; $i -lt $count; $i++) {
                $d = 8 + $i * 16
                $ox = Read-I16 $b ($d + 0)
                $oy = Read-I16 $b ($d + 2)
                $w = Read-U16 $b ($d + 4)
                $h = Read-U16 $b ($d + 6)
                $src = Read-U32 $b ($d + 8)
                $len = Read-U32 $b ($d + 12)
                if ($len -ne $w*$h*4) { throw "Frame $i length mismatch in $Path" }

                $bmp = New-Object System.Drawing.Bitmap $w,$h,([System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
                for ($y=0; $y -lt $h; $y++) {
                  for ($x=0; $x -lt $w; $x++) {
                    $p = [int]$src + (($y*$w+$x)*4)
                    $r=$b[$p]; $gg=$b[$p+1]; $bb=$b[$p+2]; $a=$b[$p+3]
                    $bmp.SetPixel($x,$y,[System.Drawing.Color]::FromArgb($a,$r,$gg,$bb))
                  }
                }

                $cx = ($i % $cols) * $cellW
                $cy = [Math]::Floor($i / $cols) * $cellH
                $g.DrawRectangle($gridPen,$cx,$cy,$cellW-1,$cellH-1)
                $g.DrawString(("#{0}  {1}x{2}  off {3},{4}" -f ($i+1),$w,$h,$ox,$oy),$font,$brush,$cx+4,$cy+4)
                $drawX = $cx + [Math]::Floor(($cellW-$w)/2)
                $drawY = $cy + 24 + [Math]::Floor((($cellH-28)-$h)/2)
                $g.DrawImage($bmp,$drawX,$drawY,$w,$h)
                $bmp.Dispose()

                $frames += [pscustomobject]@{frame=$i+1;width=$w;height=$h;offset_x=$ox;offset_y=$oy;bytes=$len}
              }
              $sheet.Save($OutPng,[System.Drawing.Imaging.ImageFormat]::Png)
              $frames | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 $OutJson
            }
            finally {
              $g.Dispose()
              $sheet.Dispose()
              $font.Dispose()
              $gridPen.Dispose()
            }
          }

          $src = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir\Data-Maps-Tiles\Tilesets\38'
          $out = Join-Path $env:GITHUB_WORKSPACE 'MapPreviews\A3ArtInspection'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $assets = @(
            'VR_CROP_MASTER',
            'A3_MUD_RUTS',
            'A3_LANDMARKS',
            'A3_FIELD_STONES',
            'A3_WOOD_YARD',
            'A3_EDGE_WEEDS',
            'A3_IRRIGATION',
            'A3_FARM_JUNK'
          )
          foreach ($name in $assets) {
            Decode-B1TC (Join-Path $src ($name+'.b1tc')) (Join-Path $out ($name+'.png')) (Join-Path $out ($name+'.json'))
          }

      - name: Upload A3 art inspection
        uses: actions/upload-artifact@v4
        with:
          name: A3-tile-art-inspection
          path: MapPreviews/A3ArtInspection/
          if-no-files-found: error
          retention-days: 14
