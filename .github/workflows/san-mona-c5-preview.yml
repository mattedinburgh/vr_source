name: VHD San Mona C5 visual QA

on:
  push:
    branches:
      - feature/vhd-renderer
    paths:
      - '.github/workflows/san-mona-c5-preview.yml'
      - 'TileEngine/**'
      - 'sgp/**'
      - 'Utils/**'
      - 'Tools/VRMapDisplayRouting.ps1'
      - 'MapPreviewTrigger/C5_RENDER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: san-mona-c5-visual-qa
  cancel-in-progress: true

jobs:
  render-c5:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 60

    steps:
      - name: Check out vr_source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Locate Git on render PC
        id: git
        shell: powershell
        run: |
          $git = $null
          $cmd = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($cmd) { $git = $cmd.Source }
          if (-not $git) {
            $git = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Recurse -Filter git.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\resources\\app\\git\\cmd\\git\.exe$' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $git -or -not (Test-Path $git)) { throw 'Git could not be found on the render PC.' }
          "path=$git" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using Git: $git"
          & $git --version

      - name: Rehydrate repository metadata when checkout used REST archive
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $git = '${{ steps.git.outputs.path }}'
          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE '.git')) {
            Write-Host 'Git metadata already present.'
            exit 0
          }

          Write-Host 'Checkout is an archive; rebuilding .git with GitHub Desktop Git.'
          & $git -C $env:GITHUB_WORKSPACE init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/mattedinburgh/vr_source.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE fetch origin feature/vhd-renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE clean -fdx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE checkout -f -B render-source '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch only map assets from vr_gamedir
        id: gamedir
        shell: powershell
        run: |
          $git = '${{ steps.git.outputs.path }}'
          $gamedir = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir'
          if (Test-Path $gamedir) { Remove-Item -Recurse -Force $gamedir }
          & $git -c core.longpaths=true clone --depth 1 --single-branch --branch feature/vhd-renderer-test --filter=blob:none --no-checkout https://github.com/mattedinburgh/vr_gamedir.git $gamedir
          if ($LASTEXITCODE -ne 0) { throw "Partial clone failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir sparse-checkout init --cone
          if ($LASTEXITCODE -ne 0) { throw "sparse-checkout init failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir sparse-checkout set Data-Maps-Tiles
          if ($LASTEXITCODE -ne 0) { throw "sparse-checkout set failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir checkout feature/vhd-renderer-test
          if ($LASTEXITCODE -ne 0) { throw "gamedir checkout failed with exit code $LASTEXITCODE" }
          $sha = (& $git -C $gamedir rev-parse HEAD).Trim()
          $c5 = Join-Path $gamedir 'Data-Maps-Tiles\maps\c5.dat'
          if (-not (Test-Path $c5)) { throw "c5.dat was not materialised: $c5" }

          # Fail before an expensive MapEditor rebuild when no C5 true-colour
          # payload exists yet. Native VHD2 is the preferred pilot location;
          # legacy Tilesets/18 B1TC remains accepted for compatibility.
          $nativeVhd2 = @(Get-ChildItem -LiteralPath (Join-Path $gamedir 'Data-Maps-Tiles\VHD2\TILESETS\18') -Filter '*.b1tc' -File -ErrorAction SilentlyContinue)
          $legacyTc = @(Get-ChildItem -LiteralPath (Join-Path $gamedir 'Data-Maps-Tiles\Tilesets\18') -Filter '*.b1tc' -File -ErrorAction SilentlyContinue)
          if (($nativeVhd2.Count + $legacyTc.Count) -eq 0) {
            throw 'C5 visual QA preflight: no native VHD2/B1TC C5 assets are present on feature/vhd-renderer-test.'
          }
          Write-Host "C5 true-colour preflight: native VHD2=$($nativeVhd2.Count), legacy B1TC=$($legacyTc.Count)"

          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "vr_gamedir SHA: $sha"

      - name: Retarget VS2013 projects to v120
        shell: powershell
        run: |
          $changed = 0
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.vcxproj' -File | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            $newText = $text.Replace('<PlatformToolset>v120_xp</PlatformToolset>', '<PlatformToolset>v120</PlatformToolset>')
            if ($newText -ne $text) {
              [System.IO.File]::WriteAllText($path, $newText, (New-Object System.Text.UTF8Encoding($false)))
              $changed++
            }
          }
          Write-Host "Retargeted $changed project file(s) to v120."

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw 'MSBuild could not be found on the render PC.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using MSBuild: $msbuild"

      - name: Build MapEditor
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2 /p:Configuration=MapEditor /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $editor = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\MapEditor_EN_Release.exe'
          if (-not (Test-Path $editor)) { throw "Expected MapEditor was not built: $editor" }

      - name: Prepare Vengeance render sandbox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gameRoot = 'C:\VENGENCE\Jagged Alliance 2'
          $sandbox = "C:\VENGENCE\JA2_RENDER_SANDBOX_$env:GITHUB_RUN_ID"
          $gamedir = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir'
          if (-not (Test-Path (Join-Path $gameRoot 'JA2_EN_Release.exe'))) { throw "Live JA2 game root not found: $gameRoot" }

          function Remove-SandboxSafely {
            param([Parameter(Mandatory=$true)][string]$Path)
            if (-not (Test-Path $Path)) { return }

            # Never recurse into data-layer junctions. Remove the reparse points first,
            # then delete only the genuinely local sandbox files/directories.
            Get-ChildItem -LiteralPath $Path -Force -Directory -ErrorAction SilentlyContinue |
              Where-Object { ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 } |
              ForEach-Object {
                Write-Host "Removing sandbox junction: $($_.FullName)"
                cmd /c rmdir "$($_.FullName)"
                if ($LASTEXITCODE -ne 0) { throw "Could not remove sandbox junction: $($_.FullName)" }
              }

            Remove-Item -LiteralPath $Path -Recurse -Force
          }

          Remove-SandboxSafely -Path $sandbox
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null

          $driveBefore = Get-PSDrive -Name C
          Write-Host ("C: free before sandbox root setup: {0:N2} GB" -f ($driveBefore.Free / 1GB))

          # Do not duplicate the game-root payload. The sandbox and the live game are on
          # the same NTFS volume, so immutable runtime files can be hard-linked at zero
          # additional payload cost. Ja2.ini and ddraw.ini stay private copies because
          # the render harness edits only those two files.
          $privateRootFiles = @('Ja2.ini', 'ddraw.ini')
          $skipRootFiles = @('JA2_EN_Release.exe', 'MapEditor_Vengeance.exe')

          Get-ChildItem -LiteralPath $gameRoot -Force -File | ForEach-Object {
            if ($_.Name -like '*.log' -or $_.Name -like '*.pdb' -or $skipRootFiles -contains $_.Name) {
              return
            }

            $destination = Join-Path $sandbox $_.Name
            if ($privateRootFiles -contains $_.Name) {
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
              Write-Host "Private copy: $($_.Name)"
              return
            }

            try {
              New-Item -ItemType HardLink -Path $destination -Target $_.FullName -ErrorAction Stop | Out-Null
              Write-Host "Hard link: $($_.Name)"
            } catch {
              # Small-file fallback only. A large fallback copy would recreate the exact
              # disk-exhaustion failure this step is designed to eliminate.
              if ($_.Length -le 16MB) {
                Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
                Write-Warning "Hard link failed for $($_.Name); copied small file instead."
              } else {
                throw "Could not hard-link large root file $($_.FullName) ($($_.Length) bytes): $($_.Exception.Message)"
              }
            }
          }

          $driveAfter = Get-PSDrive -Name C
          Write-Host ("C: free after sandbox root setup: {0:N2} GB" -f ($driveAfter.Free / 1GB))

          $excludedDirs = @(
            '00000', 'Profiles', 'MAP_PREVIEWS', '.git', 'FORK',
            'build', 'lib', '.vs', 'Data-Maps-Tiles'
          )

          Get-ChildItem -LiteralPath $gameRoot -Force -Directory | ForEach-Object {
            if ($excludedDirs -contains $_.Name) { return }
            $link = Join-Path $sandbox $_.Name
            Write-Host "Junction: $link -> $($_.FullName)"
            New-Item -ItemType Junction -Path $link -Target $_.FullName | Out-Null
          }

          # Use the freshly fetched vr_gamedir map/tile layer, not the possibly stale
          # live Data-Maps-Tiles directory. The VHD C5 graphics test layer is disposable
          # and isolated from the live installation.
          $mapLayer = Join-Path $gamedir 'Data-Maps-Tiles'
          if (-not (Test-Path (Join-Path $mapLayer 'maps\c5.dat'))) {
            throw "Fresh vr_gamedir C5 map layer is incomplete: $mapLayer"
          }
          New-Item -ItemType Junction -Path (Join-Path $sandbox 'Data-Maps-Tiles') -Target $mapLayer | Out-Null

          # Use the Vengeance editor identity and the actual Vengeance data stack.
          $builtEditor = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\MapEditor_EN_Release.exe'
          $editor = Join-Path $sandbox 'MapEditor_Vengeance.exe'
          Copy-Item -Force $builtEditor $editor

          $ja2Ini = Join-Path $sandbox 'Ja2.ini'
          $vfsIni = Join-Path $sandbox 'vfs_config.Vengeance.ini'
          if (-not (Test-Path $ja2Ini)) { throw "Missing Vengeance Ja2.ini: $ja2Ini" }
          if (-not (Test-Path $vfsIni)) { throw "Missing Vengeance VFS config: $vfsIni" }

          $ja2Text = [System.IO.File]::ReadAllText($ja2Ini)
          if ($ja2Text -notmatch '(?im)^\s*VFS_CONFIG_INI\s*=\s*vfs_config\.Vengeance\.ini\s*$') {
            throw 'Ja2.ini is not configured for vfs_config.Vengeance.ini.'
          }
          # Windowed sandbox only; the live installation is never modified.
          $ja2Text = [regex]::Replace($ja2Text, '(?im)^\s*SCREEN_MODE_WINDOWED\s*=\s*\d+\s*$', 'SCREEN_MODE_WINDOWED = 1')
          [System.IO.File]::WriteAllText($ja2Ini, $ja2Text, (New-Object System.Text.UTF8Encoding($false)))

          # The Vengeance VFS always mounts a writable UserProf. Keep the live
          # profile isolated, but provide an empty writable profile in the sandbox.
          $profileRoot = Join-Path $sandbox 'Profiles\UserProfile_Vengeance'
          New-Item -ItemType Directory -Force -Path $profileRoot | Out-Null

          $required = @('Data','Data-1.13','Data-Vengeance','Data-AIMv53','Data-Maps-Tiles','Data-PCM','Data-UI','Data-Weapon-Sounds','Data-Voice-Taunts','Data-Music','Profiles\UserProfile_Vengeance')
          foreach ($dir in $required) {
            $requiredPath = Join-Path $sandbox $dir
            if (-not (Test-Path $requiredPath)) { throw "Vengeance data layer missing from sandbox: $requiredPath" }
          }

          # cnc-ddraw defaults to OpenGL/fullscreen. For unattended editor capture,
          # give this executable an explicit GDI/windowed profile to avoid GPU/window
          # creation stalls while preserving the normal live-game renderer.
          $ddrawIni = Join-Path $sandbox 'ddraw.ini'
          if (Test-Path $ddrawIni) {
            $ddraw = [System.IO.File]::ReadAllText($ddrawIni)
            $ddraw = [regex]::Replace($ddraw, '(?ims)^\[MapEditor_Vengeance\]\s*.*?(?=^\[|\z)', '')
            $profileLines = @(
              '',
              '[MapEditor_Vengeance]',
              'windowed=true',
              'renderer=gdi',
              'singlecpu=false',
              'fixmousehook=true',
              'noactivateapp=true',
              'releasealt=true',
              'novidmem=true'
            )
            $profile = $profileLines -join [Environment]::NewLine
            [System.IO.File]::WriteAllText($ddrawIni, ($ddraw.TrimEnd() + [Environment]::NewLine + $profile + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))
          }

          $previewDir = Join-Path $sandbox 'MAP_PREVIEWS'
          New-Item -ItemType Directory -Force -Path $previewDir | Out-Null
          Write-Host 'VHD C5 render sandbox ready (private config/profile/map layer; live installation is not modified).'
          Write-Host "Editor: $editor"
          Write-Host "VFS: $vfsIni"
          Write-Host "Map layer: $mapLayer"
          exit 0

      - name: Load and render unchanged C5 with remastered graphics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = "C:\VENGENCE\JA2_RENDER_SANDBOX_$env:GITHUB_RUN_ID"
          $editor = Join-Path $sandbox 'MapEditor_Vengeance.exe'
          $previewDir = Join-Path $sandbox 'MAP_PREVIEWS'
          $statusFile = Join-Path $previewDir 'mapshot_status.txt'
          $visualLog = Join-Path $sandbox 'C5_visual_load.log'
          $expectedBmp = Join-Path $previewDir 'c5_overview.bmp'
          Remove-Item -Force -ErrorAction SilentlyContinue $statusFile,$visualLog,$expectedBmp

          . (Join-Path $env:GITHUB_WORKSPACE 'Tools\VRMapDisplayRouting.ps1')

          Write-Host "Launching unchanged C5 through VHD Vengeance MapEditor from isolated VFS working directory: $sandbox"
          $p = Start-VRProcessOnSecondary -FilePath $editor -ArgumentList "-MAPSHOT=c5.dat" -WorkingDirectory $sandbox -RequireSecondary
          $deadline = (Get-Date).AddSeconds(240)
          $lastStatus = ''
          while ((Get-Date) -lt $deadline) {
            $p.Refresh()
            if ($p.HasExited) { break }
            if ([Environment]::UserInteractive) {
              [void](Move-VRProcessWindowsToSecondary -Process $p -RequireSecondary)
            }
            if (Test-Path $statusFile) {
              $status = (Get-Content $statusFile -Raw -ErrorAction SilentlyContinue).Trim()
              if ($status -and $status -ne $lastStatus) {
                Write-Host "--- C5 MAPSHOT STATUS ---"
                Write-Host $status
                $lastStatus = $status
              }
              if ($status -match 'DONE success' -and (Test-Path $expectedBmp)) {
                Start-Sleep -Seconds 2
                $p.Refresh()
                if (-not $p.HasExited) {
                  try { $p.Kill() } catch {}
                  try { $p.WaitForExit(10000) | Out-Null } catch {}
                }
                break
              }
            }
            Start-Sleep -Seconds 2
          }

          $p.Refresh()
          if (-not $p.HasExited) {
            try { $p.Kill() } catch {}
            try { $p.WaitForExit(10000) | Out-Null } catch {}
          }

          if (-not (Test-Path $expectedBmp)) { throw "C5 MAPSHOT did not produce $expectedBmp" }
          if (-not (Test-Path $statusFile)) { throw 'C5 MAPSHOT produced no status file.' }
          $finalStatus = (Get-Content $statusFile -Raw).Trim()
          if ($finalStatus -notmatch 'DONE success') { throw "C5 MAPSHOT did not report success: $finalStatus" }
          if (-not (Test-Path $visualLog)) { throw 'C5 visual/JSD diagnostic log was not produced.' }

          $log = Get-Content $visualLog
          $trueColor = @($log | Where-Object { $_ -match '^(IMAGE_TRUECOLOR|IMAGE_VHD_NATIVE) ' })
          Write-Host "Native/true-colour tile surfaces loaded: $($trueColor.Count)"
          if ($trueColor.Count -lt 4) {
            throw "Expected C5 native VHD2/B1TC visual replacements were not active (only $($trueColor.Count) native/true-colour surfaces)."
          }

          $structural = @(
            'Cobble_Road','Streetlamp','BUILD_24','SLANT_12','FURN_MIX',
            'LAWLESS','LAWLESS2','LAWLESS4','W_DEC06','W_DEC09'
          )
          foreach ($family in $structural) {
            $imageLine = $trueColor | Where-Object { $_ -match [regex]::Escape($family) } | Select-Object -First 1
            if (-not $imageLine) {
              Write-Warning "$family was not loaded as true-colour in this tileset pass; skipping structural assertion for unused/unresolved family."
              continue
            }
            $ok = $log | Where-Object { $_ -match '^JSD_OK ' -and $_ -match [regex]::Escape($family) } | Select-Object -First 1
            if (-not $ok) {
              throw "Graphics-only invariant failed: $family loaded as B1TC but its original JSD did not load with matching object count."
            }
            Write-Host "JSD preserved: $family"
          }

          $outDir = Join-Path $env:GITHUB_WORKSPACE 'MapPreviews\C5'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item -Force $expectedBmp (Join-Path $outDir 'C5_overview.bmp')
          Copy-Item -Force $statusFile (Join-Path $outDir 'C5_mapshot_status.txt')
          Copy-Item -Force $visualLog (Join-Path $outDir 'C5_visual_load.log')

          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile($expectedBmp)
          try { $img.Save((Join-Path $outDir 'C5_overview.png'), [System.Drawing.Imaging.ImageFormat]::Png) }
          finally { $img.Dispose() }

          # Full-colour gameplay-scale captures are the primary visual QA surface.
          $tactical = @(Get-ChildItem -LiteralPath $previewDir -File -Filter 'c5.dat_tactical_*_overview.bmp' -ErrorAction SilentlyContinue |
            Sort-Object Name)
          if ($tactical.Count -lt 4) {
            throw "Expected tactical C5 captures, found only $($tactical.Count)."
          }

          $pngPaths = @()
          $viewIndex = 0
          foreach ($shot in $tactical) {
            $viewIndex++
            $bmpOut = Join-Path $outDir ("C5_tactical_{0:D2}.bmp" -f $viewIndex)
            $pngOut = Join-Path $outDir ("C5_tactical_{0:D2}.png" -f $viewIndex)
            Copy-Item -Force $shot.FullName $bmpOut
            $simg = [System.Drawing.Image]::FromFile($shot.FullName)
            try { $simg.Save($pngOut, [System.Drawing.Imaging.ImageFormat]::Png) }
            finally { $simg.Dispose() }
            $pngPaths += $pngOut
          }

          # Compact 3x2 sheet for fast human review.
          $cols = 3
          $rows = [int][Math]::Ceiling($pngPaths.Count / [double]$cols)
          $cellW = 640
          $cellH = 400
          $sheet = New-Object System.Drawing.Bitmap ($cols * $cellW), ($rows * $cellH)
          $g = [System.Drawing.Graphics]::FromImage($sheet)
          try {
            $g.Clear([System.Drawing.Color]::Black)
            for ($i=0; $i -lt $pngPaths.Count; $i++) {
              $shotImg = [System.Drawing.Image]::FromFile($pngPaths[$i])
              try {
                $scale = [Math]::Min($cellW / [double]$shotImg.Width, $cellH / [double]$shotImg.Height)
                $w = [int][Math]::Round($shotImg.Width * $scale)
                $h = [int][Math]::Round($shotImg.Height * $scale)
                $x = ($i % $cols) * $cellW + [int](($cellW - $w) / 2)
                $y = [int]([Math]::Floor($i / $cols)) * $cellH + [int](($cellH - $h) / 2)
                $g.DrawImage($shotImg, $x, $y, $w, $h)
              } finally { $shotImg.Dispose() }
            }
            $sheet.Save((Join-Path $outDir 'C5_tactical_contact.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $g.Dispose()
            $sheet.Dispose()
          }

          @{
            sector = 'C5'
            map = 'c5.dat'
            map_modified = $false
            source_sha = '${{ github.sha }}'
            gamedir_sha = '${{ steps.gamedir.outputs.sha }}'
            generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            truecolor_surfaces = $trueColor.Count
            tactical_views = $tactical.Count
            invariant = 'graphics-only'
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $outDir 'C5_validation.json')

      - name: Upload C5 validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: san-mona-c5-engine-validation
          path: MapPreviews/C5/
          if-no-files-found: error
          retention-days: 14

      - name: Remove render sandbox
        if: always()
        shell: powershell
        run: |
          $sandbox = "C:\VENGENCE\JA2_RENDER_SANDBOX_$env:GITHUB_RUN_ID"
          if (-not (Test-Path $sandbox)) { exit 0 }

          Get-ChildItem -LiteralPath $sandbox -Force -Directory -ErrorAction SilentlyContinue |
            Where-Object { ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 } |
            ForEach-Object {
              cmd /c rmdir "$($_.FullName)"
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not remove junction: $($_.FullName)"
                $global:LASTEXITCODE = 0
              }
            }

          Remove-Item -LiteralPath $sandbox -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Removed render sandbox: $sandbox"

