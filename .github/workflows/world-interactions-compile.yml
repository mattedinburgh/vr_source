name: World interactions compile

on:
  push:
    branches:
      - world/interactions-construction-2026
    paths:
      - 'Tactical/**/*.cpp'
      - 'Tactical/**/*.h'
      - 'ja2_VS2013.vcxproj'
      - 'ja2_VS2013.sln'
      - 'GENERATE_VR_BUILD_INFO.ps1'
      - '.github/workflows/world-interactions-compile.yml'
  workflow_dispatch:

jobs:
  hosted-compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out stream source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate VR build info
        shell: powershell
        run: |
          & '.\\GENERATE_VR_BUILD_INFO.ps1' -RepoRoot '.' -OutputPath '.\\.generated\\VRBuildInfo.generated.h' -Configuration 'Release' -Platform 'Win32' -TargetName 'JA2_EN_Release.exe'

      - name: Compile stream translation units
        shell: powershell
        run: |
          msbuild '.\\ja2_VS2013.vcxproj' /m /t:ClCompile /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
