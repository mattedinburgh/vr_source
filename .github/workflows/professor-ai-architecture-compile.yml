name: Professor AI architecture compile

on:
  push:
    branches:
      - ai/professor-architecture-2026-09-15

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: microsoft/setup-msbuild@v2
      - name: Verify unified AI integrity
        shell: powershell
        run: |
          & '.\\Tools\\AI\\VERIFY_AI_INTEGRITY.ps1' -RepositoryRoot '.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate VR build info
        shell: powershell
        run: |
          & '.\\GENERATE_VR_BUILD_INFO.ps1' -RepoRoot '.' -OutputPath '.\\.generated\\VRBuildInfo.generated.h' -Configuration 'Release' -Platform 'Win32' -TargetName 'JA2_EN_Release.exe'
      - name: Compile integration translation units
        shell: powershell
        run: |
          msbuild '.\\ja2_VS2013.vcxproj' /m /t:ClCompile /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
