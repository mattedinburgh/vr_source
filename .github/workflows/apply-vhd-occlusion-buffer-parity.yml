name: Apply VHD occlusion buffer parity test

on:
  push:
    branches:
      - engine/vhd-occlusion-parity-2026
    paths:
      - '.automation/vhd-occlusion-buffer-parity.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out parity branch
        uses: actions/checkout@v4
        with:
          ref: engine/vhd-occlusion-parity-2026
          fetch-depth: 20

      - name: Apply buffer-equivalence test
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --whitespace=nowarn .automation/vhd-occlusion-buffer-parity.patch
          git apply --whitespace=nowarn .automation/vhd-occlusion-buffer-parity.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TileEngine/renderworld.cpp
          git rm .automation/vhd-occlusion-buffer-parity.patch
          git rm .automation/vhd-occlusion-buffer-parity.trigger
          git commit -m "VHD occlusion: prove one-pass color and Z parity"
          git push origin HEAD:engine/vhd-occlusion-parity-2026
