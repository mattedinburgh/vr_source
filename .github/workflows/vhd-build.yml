name: Vengeance HD branch build

on:
  push:
    branches:
      - feature/vhd-renderer
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.vcxproj'
      - '**/*.props'
      - '*.sln'
      - '.github/workflows/vhd-build.yml'
  workflow_dispatch:

concurrency:
  group: vhd-renderer-build
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 30

    steps:
      - name: Check out VHD source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw 'MSBuild could not be found on the self-hosted runner.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using MSBuild: $msbuild"

      - name: Build Vengeance HD Release Win32
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2 /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\JA2_EN_Release.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not built: $exe"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "VHD build OK: $exe"
          Write-Host "SHA256: $hash"
