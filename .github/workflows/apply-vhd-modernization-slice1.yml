name: Apply VHD modernization source slice

on:
  push:
    branches:
      - engine/vhd-modernization-2026
    paths:
      - '.automation/vhd-modernization-slice1.trigger'

permissions:
  contents: write

concurrency:
  group: apply-vhd-modernization-slice1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: engine/vhd-modernization-2026
          fetch-depth: 50

      - name: Integrate verified renderer source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags --depth=80 origin engine/vhd-render-instrumentation-2026-09-15

          for commit in \
            341174ba8b20e0a58ab41e75c1a614fb1cb7d995 \
            7a729759ad \
            f0d9b2e1bc \
            355dc1ac67 \
            06d285929b \
            1c29d1215b
          do
            git cherry-pick "$commit"
          done

          git rm .automation/vhd-modernization-slice1.trigger
          git commit -m "Automation: clear VHD modernization source trigger"
          git push origin HEAD:engine/vhd-modernization-2026
