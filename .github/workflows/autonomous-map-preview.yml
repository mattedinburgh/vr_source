name: Autonomous JA2 map visual QA

on:
  push:
    branches:
      - install/all-2026-09-12
    paths:
      - 'MapPreviewTrigger/A3_RENDER.txt'
      - '.github/workflows/autonomous-map-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ja2-render-shared
  cancel-in-progress: true

jobs:
  render-a3:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 60

    steps:
      - name: Check out vr_source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Locate Git on render PC
        id: git
        shell: powershell
        run: |
          $git = $null
          $cmd = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($cmd) { $git = $cmd.Source }
          if (-not $git) {
            $git = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Recurse -Filter git.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\resources\\app\\git\\cmd\\git\.exe$' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $git -or -not (Test-Path $git)) { throw 'Git could not be found on the render PC.' }
          "path=$git" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using Git: $git"
          & $git --version

      - name: Rehydrate repository metadata when checkout used REST archive
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $git = '${{ steps.git.outputs.path }}'
          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE '.git')) {
            Write-Host 'Git metadata already present.'
            exit 0
          }

          Write-Host 'Checkout is an archive; rebuilding .git with GitHub Desktop Git.'
          & $git -C $env:GITHUB_WORKSPACE init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/mattedinburgh/vr_source.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE fetch origin install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE clean -fdx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE checkout -f -B render-source '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch only map assets from vr_gamedir
        id: gamedir
        shell: powershell
        run: |
          $git = '${{ steps.git.outputs.path }}'
          $gamedir = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir'
          if (Test-Path $gamedir) { Remove-Item -Recurse -Force $gamedir }
          & $git -c core.longpaths=true clone --depth 1 --single-branch --branch install/all-2026-09-12 --filter=blob:none --no-checkout https://github.com/mattedinburgh/vr_gamedir.git $gamedir
          if ($LASTEXITCODE -ne 0) { throw "Partial clone failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir sparse-checkout init --cone
          if ($LASTEXITCODE -ne 0) { throw "sparse-checkout init failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir sparse-checkout set Data-Maps-Tiles
          if ($LASTEXITCODE -ne 0) { throw "sparse-checkout set failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir checkout install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) { throw "gamedir checkout failed with exit code $LASTEXITCODE" }
          $sha = (& $git -C $gamedir rev-parse HEAD).Trim()
          $a3 = Join-Path $gamedir 'Data-Maps-Tiles\maps\A3.dat'
          if (-not (Test-Path $a3)) { throw "A3.dat was not materialised: $a3" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "vr_gamedir SHA: $sha"

      - name: Retarget VS2013 projects to v120
        shell: powershell
        run: |
          $changed = 0
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.vcxproj' -File | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            $newText = $text.Replace('<PlatformToolset>v120_xp</PlatformToolset>', '<PlatformToolset>v120</PlatformToolset>')
            if ($newText -ne $text) {
              [System.IO.File]::WriteAllText($path, $newText, (New-Object System.Text.UTF8Encoding($false)))
              $changed++
            }
          }
          Write-Host "Retargeted $changed project file(s) to v120."

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw 'MSBuild could not be found on the render PC.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using MSBuild: $msbuild"

      - name: Build MapEditor
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2 /p:Configuration=MapEditor /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $editor = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\MapEditor_EN_Release.exe'
          if (-not (Test-Path $editor)) { throw "Expected MapEditor was not built: $editor" }

      - name: Prepare Vengeance render sandbox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gameRoot = 'C:\VENGENCE\Jagged Alliance 2'
          $sandbox = "C:\VENGENCE\JA2_RENDER_SANDBOX_$env:GITHUB_RUN_ID"
          $gamedir = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir'
          if (-not (Test-Path (Join-Path $gameRoot 'JA2_EN_Release.exe'))) { throw "Live JA2 game root not found: $gameRoot" }

          function Remove-SandboxSafely {
            param([Parameter(Mandatory=$true)][string]$Path)
            if (-not (Test-Path $Path)) { return }

            # Never recurse into data-layer junctions. Remove the reparse points first,
            # then delete only the genuinely local sandbox files/directories.
            Get-ChildItem -LiteralPath $Path -Force -Directory -ErrorAction SilentlyContinue |
              Where-Object { ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 } |
              ForEach-Object {
                Write-Host "Removing sandbox junction: $($_.FullName)"
                cmd /c rmdir "$($_.FullName)"
                if ($LASTEXITCODE -ne 0) { throw "Could not remove sandbox junction: $($_.FullName)" }
              }

            Remove-Item -LiteralPath $Path -Recurse -Force
          }

          # Cancelled self-hosted runs can leave old render sandboxes behind. Since this
          # workflow is serialized by ja2-render-shared, no other A3 render can be using
          # one now. Reclaim those stale folders before allocating anything new.
          Get-ChildItem -LiteralPath 'C:\VENGENCE' -Force -Directory -Filter 'JA2_RENDER_SANDBOX_*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              try {
                Write-Host "Reclaiming stale render sandbox: $($_.FullName)"
                Remove-SandboxSafely -Path $_.FullName
              } catch {
                Write-Warning "Could not fully remove stale sandbox $($_.FullName): $($_.Exception.Message)"
              }
            }

          Remove-SandboxSafely -Path $sandbox
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null

          $driveBefore = Get-PSDrive -Name C
          Write-Host ("C: free before sandbox root setup: {0:N2} GB" -f ($driveBefore.Free / 1GB))

          # Do not duplicate the game-root payload. The sandbox and the live game are on
          # the same NTFS volume, so immutable runtime files can be hard-linked at zero
          # additional payload cost. Ja2.ini and ddraw.ini stay private copies because
          # the render harness edits only those two files.
          $privateRootFiles = @('Ja2.ini', 'ddraw.ini')
          $skipRootFiles = @('JA2_EN_Release.exe', 'MapEditor_Vengeance.exe')

          Get-ChildItem -LiteralPath $gameRoot -Force -File | ForEach-Object {
            if ($_.Name -like '*.log' -or $_.Name -like '*.pdb' -or $skipRootFiles -contains $_.Name) {
              return
            }

            $destination = Join-Path $sandbox $_.Name
            if ($privateRootFiles -contains $_.Name) {
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
              Write-Host "Private copy: $($_.Name)"
              return
            }

            try {
              New-Item -ItemType HardLink -Path $destination -Target $_.FullName -ErrorAction Stop | Out-Null
              Write-Host "Hard link: $($_.Name)"
            } catch {
              # Small-file fallback only. A large fallback copy would recreate the exact
              # disk-exhaustion failure this step is designed to eliminate.
              if ($_.Length -le 16MB) {
                Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
                Write-Warning "Hard link failed for $($_.Name); copied small file instead."
              } else {
                throw "Could not hard-link large root file $($_.FullName) ($($_.Length) bytes): $($_.Exception.Message)"
              }
            }
          }

          $driveAfter = Get-PSDrive -Name C
          Write-Host ("C: free after sandbox root setup: {0:N2} GB" -f ($driveAfter.Free / 1GB))

          $excludedDirs = @(
            '00000', 'Profiles', 'MAP_PREVIEWS', '.git', 'FORK',
            'build', 'lib', '.vs', 'Data-Maps-Tiles'
          )

          Get-ChildItem -LiteralPath $gameRoot -Force -Directory | ForEach-Object {
            if ($excludedDirs -contains $_.Name) { return }
            $link = Join-Path $sandbox $_.Name
            Write-Host "Junction: $link -> $($_.FullName)"
            New-Item -ItemType Junction -Path $link -Target $_.FullName | Out-Null
          }

          # Use the freshly fetched vr_gamedir map/tile layer, not the possibly stale
          # live Data-Maps-Tiles directory. It is disposable, so pass 2 may safely
          # overlay A3_REMASTERED.dat there without touching the live installation.
          $mapLayer = Join-Path $gamedir 'Data-Maps-Tiles'
          if (-not (Test-Path (Join-Path $mapLayer 'maps\A3.dat'))) {
            throw "Fresh vr_gamedir map layer is incomplete: $mapLayer"
          }
          New-Item -ItemType Junction -Path (Join-Path $sandbox 'Data-Maps-Tiles') -Target $mapLayer | Out-Null

          # Use the Vengeance editor identity and the actual Vengeance data stack.
          $builtEditor = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\MapEditor_EN_Release.exe'
          $editor = Join-Path $sandbox 'MapEditor_Vengeance.exe'
          Copy-Item -Force $builtEditor $editor

          $ja2Ini = Join-Path $sandbox 'Ja2.ini'
          $vfsIni = Join-Path $sandbox 'vfs_config.Vengeance.ini'
          if (-not (Test-Path $ja2Ini)) { throw "Missing Vengeance Ja2.ini: $ja2Ini" }
          if (-not (Test-Path $vfsIni)) { throw "Missing Vengeance VFS config: $vfsIni" }

          $ja2Text = [System.IO.File]::ReadAllText($ja2Ini)
          if ($ja2Text -notmatch '(?im)^\s*VFS_CONFIG_INI\s*=\s*vfs_config\.Vengeance\.ini\s*$') {
            throw 'Ja2.ini is not configured for vfs_config.Vengeance.ini.'
          }
          # Windowed sandbox only; the live installation is never modified.
          $ja2Text = [regex]::Replace($ja2Text, '(?im)^\s*SCREEN_MODE_WINDOWED\s*=\s*\d+\s*$', 'SCREEN_MODE_WINDOWED = 1')
          [System.IO.File]::WriteAllText($ja2Ini, $ja2Text, (New-Object System.Text.UTF8Encoding($false)))

          # The Vengeance VFS always mounts a writable UserProf. Keep the live
          # profile isolated, but provide an empty writable profile in the sandbox.
          $profileRoot = Join-Path $sandbox 'Profiles\UserProfile_Vengeance'
          New-Item -ItemType Directory -Force -Path $profileRoot | Out-Null

          $required = @('Data','Data-1.13','Data-Vengeance','Data-AIMv53','Data-Maps-Tiles','Data-PCM','Data-UI','Data-Weapon-Sounds','Data-Voice-Taunts','Data-Music','Profiles\UserProfile_Vengeance')
          foreach ($dir in $required) {
            $requiredPath = Join-Path $sandbox $dir
            if (-not (Test-Path $requiredPath)) { throw "Vengeance data layer missing from sandbox: $requiredPath" }
          }

          # cnc-ddraw defaults to OpenGL/fullscreen. For unattended editor capture,
          # give this executable an explicit GDI/windowed profile to avoid GPU/window
          # creation stalls while preserving the normal live-game renderer.
          $ddrawIni = Join-Path $sandbox 'ddraw.ini'
          if (Test-Path $ddrawIni) {
            $ddraw = [System.IO.File]::ReadAllText($ddrawIni)
            $ddraw = [regex]::Replace($ddraw, '(?ims)^\[MapEditor_Vengeance\]\s*.*?(?=^\[|\z)', '')
            $profileLines = @(
              '',
              '[MapEditor_Vengeance]',
              'windowed=true',
              'renderer=gdi',
              'singlecpu=false',
              'fixmousehook=true',
              'noactivateapp=true',
              'releasealt=true',
              'novidmem=true'
            )
            $profile = $profileLines -join [Environment]::NewLine
            [System.IO.File]::WriteAllText($ddrawIni, ($ddraw.TrimEnd() + [Environment]::NewLine + $profile + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))
          }

          $previewDir = Join-Path $sandbox 'MAP_PREVIEWS'
          New-Item -ItemType Directory -Force -Path $previewDir | Out-Null
          Write-Host 'Vengeance render sandbox ready (junction-backed; live data remains read-only).'
          Write-Host "Editor: $editor"
          Write-Host "VFS: $vfsIni"
          Write-Host "Map layer: $mapLayer"
          exit 0

      - name: Bake and render A3 through Vengeance MapEditor
        shell: powershell
        run: |
          $sandbox = "C:\VENGENCE\JA2_RENDER_SANDBOX_$env:GITHUB_RUN_ID"
          $editor = Join-Path $sandbox 'MapEditor_Vengeance.exe'
          $previewDir = Join-Path $sandbox 'MAP_PREVIEWS'
          $statusFile = Join-Path $previewDir 'mapshot_status.txt'
          $sourceBmp = Join-Path $previewDir 'A3_overview.bmp'
          $pristineBmp = Join-Path $previewDir 'A3_PRISTINE_overview.bmp'
          $finalBmp = Join-Path $previewDir 'A3_REMASTERED_overview.bmp'

          $pilotOut = Join-Path $env:GITHUB_WORKSPACE 'MapPreviews\Pilot5'
          $pilotMaps = Join-Path $pilotOut 'Maps'
          New-Item -ItemType Directory -Force -Path $pilotOut | Out-Null
          New-Item -ItemType Directory -Force -Path $pilotMaps | Out-Null
          $env:JA2_MAP_FACTORY_OUTPUT = $pilotMaps
          Write-Host "Map Factory staged-map output: $pilotMaps"

          function Invoke-VengeanceMapshot {
            param(
              [Parameter(Mandatory=$true)][string]$MapName,
              [Parameter(Mandatory=$true)][string]$ExpectedBmp
            )

            Remove-Item -Force -ErrorAction SilentlyContinue $statusFile
            Remove-Item -Force -ErrorAction SilentlyContinue $ExpectedBmp

            Write-Host "Launching Vengeance editor MAPSHOT: $editor -MAPSHOT=$MapName"
            $p = Start-Process -FilePath $editor -ArgumentList "-MAPSHOT=$MapName" -WorkingDirectory $sandbox -PassThru
            $deadline = (Get-Date).AddSeconds(180)
            $startupDeadline = (Get-Date).AddSeconds(60)
            $lastStatus = ''
            $completed = $false
            $forcedExitAfterSuccess = $false

            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if ($p.HasExited) { break }

              if (Test-Path $statusFile) {
                $status = (Get-Content $statusFile -Raw -ErrorAction SilentlyContinue).Trim()
                if ($status -and $status -ne $lastStatus) {
                  Write-Host "--- MAPSHOT STATUS $MapName ---"
                  Write-Host $status
                  $lastStatus = $status
                }

                if ($status -match 'DONE success' -and (Test-Path $ExpectedBmp)) {
                  $completed = $true
                  Start-Sleep -Seconds 2
                  $p.Refresh()
                  if (-not $p.HasExited) {
                    Write-Warning "MAPSHOT $MapName completed but editor did not terminate; stopping it after successful capture."
                    try { $p.Kill() } catch {}
                    try { $p.WaitForExit(10000) | Out-Null } catch {}
                    $forcedExitAfterSuccess = $true
                  }
                  break
                }
              }
              elseif ((Get-Date) -gt $startupDeadline) {
                Write-Warning "MAPSHOT $MapName did not reach its initializer within 60 seconds."
                break
              }

              Start-Sleep -Seconds 2
            }

            $p.Refresh()
            if (-not $p.HasExited) {
              try { $p.Kill() } catch {}
              try { $p.WaitForExit(10000) | Out-Null } catch {}
            }

            $finalStatus = ''
            if (Test-Path $statusFile) {
              $finalStatus = (Get-Content $statusFile -Raw -ErrorAction SilentlyContinue).Trim()
              Write-Host "--- FINAL MAPSHOT STATUS $MapName ---"
              Write-Host $finalStatus
            } else {
              Write-Warning "No MAPSHOT status file for $MapName."
            }

            if (-not (Test-Path $ExpectedBmp)) {
              throw "MAPSHOT $MapName did not produce expected engine preview: $ExpectedBmp"
            }
            if ($finalStatus -notmatch 'DONE success') {
              throw "MAPSHOT $MapName produced a preview but did not report DONE success."
            }

            if ($p.HasExited -and $p.ExitCode -ne 0) {
              Write-Warning "MapEditor_Vengeance exited with code $($p.ExitCode) after successful MAPSHOT $MapName; accepting engine result."
            }

            return $forcedExitAfterSuccess
          }

          # Pass 0: create a byte-identical source alias whose name does not
          # activate the A3 visual profile.  After the Map Factory port this gives
          # us six genuine pristine tactical views for side-by-side QA.
          $sourceMap = Join-Path $sandbox 'Data-Maps-Tiles\maps\A3.dat'
          $pristineMap = Join-Path $sandbox 'Data-Maps-Tiles\maps\A3_PRISTINE.dat'
          Copy-Item -Force $sourceMap $pristineMap
          $forcedPristineExit = Invoke-VengeanceMapshot -MapName 'A3_PRISTINE.dat' -ExpectedBmp $pristineBmp

          # Pass 1: load the authoritative A3.dat through the Vengeance VFS.
          # MapUtility applies the A3 dressing and SaveWorld() persists that exact
          # in-memory sector as A3_REMASTERED.dat in the isolated writable profile.
          # The generic Map Factory path also runs A8/A12/B13/F15 in this invocation.
          $forcedBakeExit = Invoke-VengeanceMapshot -MapName 'A3.dat' -ExpectedBmp $sourceBmp

          # SaveWorld writes through the VFS writable UserProf. Require that
          # exact output instead of accepting a pre-existing A3_REMASTERED.dat
          # from Data-Maps-Tiles (the repository already contains an older bake).
          $bakedPath = Join-Path $sandbox 'Profiles\UserProfile_Vengeance\MAPS\A3_REMASTERED.dat'
          if (-not (Test-Path $bakedPath)) {
            throw "A3 source MAPSHOT succeeded but the fresh VFS bake was not found: $bakedPath"
          }
          $baked = Get-Item $bakedPath
          $bakedHash = (Get-FileHash $baked.FullName -Algorithm SHA256).Hash
          $sourceHash = (Get-FileHash $sourceMap -Algorithm SHA256).Hash
          if ($bakedHash -eq $sourceHash) {
            throw 'Fresh A3_REMASTERED.dat is byte-identical to A3.dat; farm dressing was not persisted.'
          }
          Write-Host "Fresh baked Vengeance A3 map: $($baked.FullName) ($($baked.Length) bytes)"
          Write-Host "A3 source SHA256: $sourceHash"
          Write-Host "A3 baked  SHA256: $bakedHash"

          # Eliminate VFS precedence ambiguity for validation. The sandbox is a
          # disposable copy, so overlay the fresh bake onto its Data-Maps-Tiles
          # A3_REMASTERED.dat as well. Whichever VFS layer wins, pass 2 opens the
          # exact map produced moments ago.
          $validationMap = Join-Path $sandbox 'Data-Maps-Tiles\maps\A3_REMASTERED.dat'
          Copy-Item -Force $baked.FullName $validationMap
          $validationHash = (Get-FileHash $validationMap -Algorithm SHA256).Hash
          if ($validationHash -ne $bakedHash) {
            throw 'Validation A3_REMASTERED.dat hash does not match fresh VFS bake.'
          }

          # Pass 2: reopen the persisted map through the same Vengeance VFS and
          # render the actual baked result. This proves that the output is a valid
          # loadable map, not merely a transient dressed in-memory world.
          $forcedFinalExit = Invoke-VengeanceMapshot -MapName 'A3_REMASTERED.dat' -ExpectedBmp $finalBmp

          Add-Type -AssemblyName System.Drawing

          # Collect every tactical view emitted by the Map Factory pilot.  Keep
          # raw BMPs for deterministic metric analysis and generate PNG copies for
          # fast human review.
          Get-ChildItem -LiteralPath $previewDir -File -Filter '*_tactical_*_overview.bmp' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $dstBmp = Join-Path $pilotOut $_.Name
              Copy-Item -Force $_.FullName $dstBmp

              $pngName = ($_.BaseName -replace '_overview
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $png = Join-Path $outDir 'A3_latest.png'
          $img = [System.Drawing.Image]::FromFile($finalBmp)
          try { $img.Save($png, [System.Drawing.Imaging.ImageFormat]::Png) } finally { $img.Dispose() }

          if (Test-Path $statusFile) {
            Copy-Item -Force $statusFile (Join-Path $outDir 'A3_mapshot_status.txt')
          }
          Copy-Item -Force $baked.FullName (Join-Path $outDir 'A3_REMASTERED.dat')

          @{
            sector = 'A3_REMASTERED'
            source_sha = '${{ github.sha }}'
            gamedir_sha = '${{ steps.gamedir.outputs.sha }}'
            generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            renderer = 'Vengeance MapEditor two-pass MAPSHOT'
            editor = 'MapEditor_Vengeance.exe'
            vfs = 'vfs_config.Vengeance.ini'
            sandbox = $sandbox
            baked_map_bytes = $baked.Length
            pristine_pass_forced_exit = $forcedPristineExit
            source_pass_forced_exit = $forcedBakeExit
            final_pass_forced_exit = $forcedFinalExit
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $outDir 'A3_latest.json')

          Write-Host "A3 baked map validated by reload and rendered: $png"

      - name: Build five-map side-by-side contact sheets
        shell: powershell
        run: |
          & '.\Tools\New-MapFactoryContactSheets.ps1' -PreviewDir '.\MapPreviews\Pilot5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run perceptual five-map visual QA
        id: visualqa
        continue-on-error: true
        shell: powershell
        run: |
          & '.\Tools\Test-MapFactoryVisualQA.ps1' -PreviewDir '.\MapPreviews\Pilot5'
          exit $LASTEXITCODE

      - name: Upload render and five-map pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vengeance-five-map-remaster-pilot
          path: |
            MapPreviews/Auto/
            MapPreviews/Pilot5/
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest preview to repository
        shell: powershell
        run: |
          $git = '${{ steps.git.outputs.path }}'
          & $git -C $env:GITHUB_WORKSPACE add MapPreviews/Auto/A3_latest.png MapPreviews/Auto/A3_latest.json
          Get-ChildItem '.\MapPreviews\Pilot5' -Filter '*_contact.png' -File -ErrorAction SilentlyContinue | ForEach-Object {
            & $git -C $env:GITHUB_WORKSPACE add -- $_.FullName
          }
          foreach ($qa in @('.\MapPreviews\Pilot5\map_factory_visual_qa.csv','.\MapPreviews\Pilot5\map_factory_visual_qa.json')) {
            if (Test-Path $qa) { & $git -C $env:GITHUB_WORKSPACE add -- $qa }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -C $env:GITHUB_WORKSPACE diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Preview is unchanged.'; exit 0 }
          & $git -C $env:GITHUB_WORKSPACE config user.name 'github-actions[bot]'
          & $git -C $env:GITHUB_WORKSPACE config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & $git -C $env:GITHUB_WORKSPACE commit -m 'Update autonomous A3 engine preview'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            & $git -C $env:GITHUB_WORKSPACE pull --rebase origin install/all-2026-09-12
            if ($LASTEXITCODE -eq 0) {
              & $git -C $env:GITHUB_WORKSPACE push origin HEAD:install/all-2026-09-12
              if ($LASTEXITCODE -eq 0) { exit 0 }
