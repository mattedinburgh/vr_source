name: Autonomous JA2 map visual QA

on:
  push:
    branches:
      - install/all-2026-09-12
    paths:
      - 'MapPreviewTrigger/A3_RENDER.txt'
      - '.github/workflows/autonomous-map-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ja2-autonomous-map-preview
  cancel-in-progress: true

jobs:
  render-a3:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 60

    steps:
      - name: Check out vr_source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Locate Git on render PC
        id: git
        shell: powershell
        run: |
          $git = $null
          $cmd = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($cmd) { $git = $cmd.Source }
          if (-not $git) {
            $git = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Recurse -Filter git.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\resources\\app\\git\\cmd\\git\.exe$' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $git -or -not (Test-Path $git)) { throw 'Git could not be found on the render PC.' }
          "path=$git" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using Git: $git"
          & $git --version

      - name: Fetch only map assets from vr_gamedir
        id: gamedir
        shell: powershell
        run: |
          $git = '${{ steps.git.outputs.path }}'
          $gamedir = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir'
          if (Test-Path $gamedir) { Remove-Item -Recurse -Force $gamedir }
          & $git -c core.longpaths=true clone --depth 1 --single-branch --branch install/all-2026-09-12 --filter=blob:none --no-checkout https://github.com/mattedinburgh/vr_gamedir.git $gamedir
          if ($LASTEXITCODE -ne 0) { throw "Partial clone failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir sparse-checkout init --cone
          if ($LASTEXITCODE -ne 0) { throw "sparse-checkout init failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir sparse-checkout set Data-Maps-Tiles
          if ($LASTEXITCODE -ne 0) { throw "sparse-checkout set failed with exit code $LASTEXITCODE" }
          & $git -C $gamedir checkout install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) { throw "gamedir checkout failed with exit code $LASTEXITCODE" }
          $sha = (& $git -C $gamedir rev-parse HEAD).Trim()
          $a3 = Join-Path $gamedir 'Data-Maps-Tiles\maps\A3.dat'
          if (-not (Test-Path $a3)) { throw "A3.dat was not materialised: $a3" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "vr_gamedir SHA: $sha"

      - name: Retarget VS2013 projects to v120
        shell: powershell
        run: |
          $changed = 0
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.vcxproj' -File | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            $newText = $text.Replace('<PlatformToolset>v120_xp</PlatformToolset>', '<PlatformToolset>v120</PlatformToolset>')
            if ($newText -ne $text) {
              [System.IO.File]::WriteAllText($path, $newText, (New-Object System.Text.UTF8Encoding($false)))
              $changed++
            }
          }
          Write-Host "Retargeted $changed project file(s) to v120."

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw 'MSBuild could not be found on the render PC.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using MSBuild: $msbuild"

      - name: Build MapEditor
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2 /p:Configuration=MapEditor /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $editor = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\MapEditor_EN_Release.exe'
          if (-not (Test-Path $editor)) { throw "Expected MapEditor was not built: $editor" }

      - name: Prepare Vengeance render sandbox
        shell: powershell
        run: |
          $gameRoot = 'C:\VENGENCE\Jagged Alliance 2'
          $sandbox = 'C:\VENGENCE\JA2_RENDER_SANDBOX'
          $gamedir = Join-Path $env:GITHUB_WORKSPACE '_vr_gamedir'
          if (-not (Test-Path (Join-Path $gameRoot 'JA2_EN_Release.exe'))) { throw "Live JA2 game root not found: $gameRoot" }

          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          & robocopy $gameRoot $sandbox /MIR /R:1 /W:1 /XD (Join-Path $gameRoot '00000') (Join-Path $gameRoot 'Profiles') (Join-Path $gameRoot 'MAP_PREVIEWS') /XF '*.log'
          $rc = $LASTEXITCODE
          if ($rc -gt 7) { throw "Sandbox refresh failed: robocopy $rc" }
          Write-Host "Sandbox refresh robocopy exit code $rc (0-7 = success)."
          $global:LASTEXITCODE = 0

          & robocopy (Join-Path $gamedir 'Data-Maps-Tiles') (Join-Path $sandbox 'Data-Maps-Tiles') /MIR /R:1 /W:1
          $rc = $LASTEXITCODE
          if ($rc -gt 7) { throw "Map asset overlay failed: robocopy $rc" }
          Write-Host "Map asset overlay robocopy exit code $rc (0-7 = success)."
          $global:LASTEXITCODE = 0

          # Use the Vengeance editor identity and the actual Vengeance data stack.
          $builtEditor = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\MapEditor_EN_Release.exe'
          $editor = Join-Path $sandbox 'MapEditor_Vengeance.exe'
          Copy-Item -Force $builtEditor $editor

          $ja2Ini = Join-Path $sandbox 'Ja2.ini'
          $vfsIni = Join-Path $sandbox 'vfs_config.Vengeance.ini'
          if (-not (Test-Path $ja2Ini)) { throw "Missing Vengeance Ja2.ini: $ja2Ini" }
          if (-not (Test-Path $vfsIni)) { throw "Missing Vengeance VFS config: $vfsIni" }

          $ja2Text = [System.IO.File]::ReadAllText($ja2Ini)
          if ($ja2Text -notmatch '(?im)^\s*VFS_CONFIG_INI\s*=\s*vfs_config\.Vengeance\.ini\s*$') {
            throw 'Ja2.ini is not configured for vfs_config.Vengeance.ini.'
          }
          # Windowed sandbox only; the live installation is never modified.
          $ja2Text = [regex]::Replace($ja2Text, '(?im)^\s*SCREEN_MODE_WINDOWED\s*=\s*\d+\s*$', 'SCREEN_MODE_WINDOWED = 1')
          [System.IO.File]::WriteAllText($ja2Ini, $ja2Text, (New-Object System.Text.UTF8Encoding($false)))

          # The Vengeance VFS always mounts a writable UserProf. Keep the live
          # profile isolated, but provide an empty writable profile in the sandbox.
          $profileRoot = Join-Path $sandbox 'Profiles\UserProfile_Vengeance'
          if (Test-Path $profileRoot) { Remove-Item -Recurse -Force $profileRoot }
          New-Item -ItemType Directory -Force -Path $profileRoot | Out-Null

          $required = @('Data','Data-1.13','Data-Vengeance','Data-AIMv53','Data-Maps-Tiles','Data-PCM','Data-UI','Data-Weapon-Sounds','Data-Voice-Taunts','Data-Music','Profiles\UserProfile_Vengeance')
          foreach ($dir in $required) {
            $path = Join-Path $sandbox $dir
            if (-not (Test-Path $path)) { throw "Vengeance data layer missing from sandbox: $path" }
          }

          # cnc-ddraw defaults to OpenGL/fullscreen. For unattended editor capture,
          # give this executable an explicit GDI/windowed profile to avoid GPU/window
          # creation stalls while preserving the normal live-game renderer.
          $ddrawIni = Join-Path $sandbox 'ddraw.ini'
          if (Test-Path $ddrawIni) {
            $ddraw = [System.IO.File]::ReadAllText($ddrawIni)
            $ddraw = [regex]::Replace($ddraw, '(?ims)^\[MapEditor_Vengeance\]\s*.*?(?=^\[|\z)', '')
            $profileLines = @(
              '',
              '[MapEditor_Vengeance]',
              'windowed=true',
              'renderer=gdi',
              'singlecpu=false',
              'fixmousehook=true',
              'noactivateapp=true',
              'releasealt=true',
              'novidmem=true'
            )
            $profile = $profileLines -join [Environment]::NewLine
            [System.IO.File]::WriteAllText($ddrawIni, ($ddraw.TrimEnd() + [Environment]::NewLine + $profile + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))
          }

          $previewDir = Join-Path $sandbox 'MAP_PREVIEWS'
          New-Item -ItemType Directory -Force -Path $previewDir | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $previewDir 'A3_overview.bmp')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $previewDir 'A3_REMASTERED_overview.bmp')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $previewDir 'mapshot_status.txt')
          Write-Host 'Vengeance render sandbox ready.'
          Write-Host "Editor: $editor"
          Write-Host "VFS: $vfsIni"
          exit 0

      - name: Bake and render A3 through Vengeance MapEditor
        shell: powershell
        run: |
          $sandbox = 'C:\VENGENCE\JA2_RENDER_SANDBOX'
          $editor = Join-Path $sandbox 'MapEditor_Vengeance.exe'
          $previewDir = Join-Path $sandbox 'MAP_PREVIEWS'
          $statusFile = Join-Path $previewDir 'mapshot_status.txt'
          $sourceBmp = Join-Path $previewDir 'A3_overview.bmp'
          $finalBmp = Join-Path $previewDir 'A3_REMASTERED_overview.bmp'

          function Invoke-VengeanceMapshot {
            param(
              [Parameter(Mandatory=$true)][string]$MapName,
              [Parameter(Mandatory=$true)][string]$ExpectedBmp
            )

            Remove-Item -Force -ErrorAction SilentlyContinue $statusFile
            Remove-Item -Force -ErrorAction SilentlyContinue $ExpectedBmp

            Write-Host "Launching Vengeance editor MAPSHOT: $editor -MAPSHOT=$MapName"
            $p = Start-Process -FilePath $editor -ArgumentList "-MAPSHOT=$MapName" -WorkingDirectory $sandbox -PassThru
            $deadline = (Get-Date).AddSeconds(180)
            $startupDeadline = (Get-Date).AddSeconds(60)
            $lastStatus = ''
            $completed = $false
            $forcedExitAfterSuccess = $false

            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if ($p.HasExited) { break }

              if (Test-Path $statusFile) {
                $status = (Get-Content $statusFile -Raw -ErrorAction SilentlyContinue).Trim()
                if ($status -and $status -ne $lastStatus) {
                  Write-Host "--- MAPSHOT STATUS $MapName ---"
                  Write-Host $status
                  $lastStatus = $status
                }

                if ($status -match 'DONE success' -and (Test-Path $ExpectedBmp)) {
                  $completed = $true
                  Start-Sleep -Seconds 2
                  $p.Refresh()
                  if (-not $p.HasExited) {
                    Write-Warning "MAPSHOT $MapName completed but editor did not terminate; stopping it after successful capture."
                    try { $p.Kill() } catch {}
                    try { $p.WaitForExit(10000) | Out-Null } catch {}
                    $forcedExitAfterSuccess = $true
                  }
                  break
                }
              }
              elseif ((Get-Date) -gt $startupDeadline) {
                Write-Warning "MAPSHOT $MapName did not reach its initializer within 60 seconds."
                break
              }

              Start-Sleep -Seconds 2
            }

            $p.Refresh()
            if (-not $p.HasExited) {
              try { $p.Kill() } catch {}
              try { $p.WaitForExit(10000) | Out-Null } catch {}
            }

            $finalStatus = ''
            if (Test-Path $statusFile) {
              $finalStatus = (Get-Content $statusFile -Raw -ErrorAction SilentlyContinue).Trim()
              Write-Host "--- FINAL MAPSHOT STATUS $MapName ---"
              Write-Host $finalStatus
            } else {
              Write-Warning "No MAPSHOT status file for $MapName."
            }

            if (-not (Test-Path $ExpectedBmp)) {
              throw "MAPSHOT $MapName did not produce expected engine preview: $ExpectedBmp"
            }
            if ($finalStatus -notmatch 'DONE success') {
              throw "MAPSHOT $MapName produced a preview but did not report DONE success."
            }

            if ($p.HasExited -and $p.ExitCode -ne 0) {
              Write-Warning "MapEditor_Vengeance exited with code $($p.ExitCode) after successful MAPSHOT $MapName; accepting engine result."
            }

            return $forcedExitAfterSuccess
          }

          # Pass 1: load the authoritative A3.dat through the Vengeance VFS.
          # MapUtility applies the A3 dressing and SaveWorld() persists that exact
          # in-memory sector as A3_REMASTERED.dat in the isolated writable profile.
          $forcedBakeExit = Invoke-VengeanceMapshot -MapName 'A3.dat' -ExpectedBmp $sourceBmp

          $baked = Get-ChildItem $sandbox -Recurse -File -Filter 'A3_REMASTERED.dat' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $baked) {
            throw 'A3 source MAPSHOT succeeded but the baked A3_REMASTERED.dat was not found in the Vengeance sandbox.'
          }
          Write-Host "Baked Vengeance A3 map: $($baked.FullName) ($($baked.Length) bytes)"

          # Pass 2: reopen the persisted map through the same Vengeance VFS and
          # render the actual baked result. This proves that the output is a valid
          # loadable map, not merely a transient dressed in-memory world.
          $forcedFinalExit = Invoke-VengeanceMapshot -MapName 'A3_REMASTERED.dat' -ExpectedBmp $finalBmp

          Add-Type -AssemblyName System.Drawing
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'MapPreviews\Auto'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $png = Join-Path $outDir 'A3_latest.png'
          $img = [System.Drawing.Image]::FromFile($finalBmp)
          try { $img.Save($png, [System.Drawing.Imaging.ImageFormat]::Png) } finally { $img.Dispose() }

          if (Test-Path $statusFile) {
            Copy-Item -Force $statusFile (Join-Path $outDir 'A3_mapshot_status.txt')
          }
          Copy-Item -Force $baked.FullName (Join-Path $outDir 'A3_REMASTERED.dat')

          @{
            sector = 'A3_REMASTERED'
            source_sha = '${{ github.sha }}'
            gamedir_sha = '${{ steps.gamedir.outputs.sha }}'
            generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            renderer = 'Vengeance MapEditor two-pass MAPSHOT'
            editor = 'MapEditor_Vengeance.exe'
            vfs = 'vfs_config.Vengeance.ini'
            sandbox = $sandbox
            baked_map_bytes = $baked.Length
            source_pass_forced_exit = $forcedBakeExit
            final_pass_forced_exit = $forcedFinalExit
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $outDir 'A3_latest.json')

          Write-Host "A3 baked map validated by reload and rendered: $png"

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: A3-engine-preview
          path: |
            MapPreviews/Auto/A3_latest.png
            MapPreviews/Auto/A3_latest.json
            MapPreviews/Auto/A3_mapshot_status.txt
            MapPreviews/Auto/A3_REMASTERED.dat
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest preview to repository
        shell: powershell
        run: |
          $git = '${{ steps.git.outputs.path }}'
          & $git add MapPreviews/Auto/A3_latest.png MapPreviews/Auto/A3_latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Preview is unchanged.'; exit 0 }
          & $git config user.name 'github-actions[bot]'
          & $git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & $git commit -m 'Update autonomous A3 engine preview'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            & $git pull --rebase origin install/all-2026-09-12
            if ($LASTEXITCODE -eq 0) {
              & $git push origin HEAD:install/all-2026-09-12
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            Start-Sleep -Seconds ($attempt * 2)
          }
          throw 'Could not publish A3 preview after 5 attempts.'
