name: Compile-only Black Box v2

on:
  push:
    branches:
      - validation/blackbox-v2-compact-final-2026-09-14
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Retarget legacy projects
        shell: powershell
        run: |
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.vcxproj' -File | ForEach-Object {
            $p=$_.FullName
            $t=[IO.File]::ReadAllText($p)
            $n=$t.Replace('<PlatformToolset>v120_xp</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>').Replace('<PlatformToolset>v120</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            if($n -ne $t){[IO.File]::WriteAllText($p,$n,(New-Object Text.UTF8Encoding($false)))}
          }
      - name: Compile game objects without legacy RakNet link
        shell: powershell
        run: |
          msbuild '.\ja2_VS2013.vcxproj' /m /t:ClCompile /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
