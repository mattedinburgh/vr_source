name: Build San Mona C5 native VHD2 scratch assets

on:
  push:
    branches:
      - feature/vhd-renderer
    paths:
      - 'Tools/SanMonaC5/**'
      - '.github/workflows/build-san-mona-c5-vhd2-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: san-mona-c5-vhd2-assets
  cancel-in-progress: true

jobs:
  build-c5-vhd2-assets:
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 60

    steps:
      - name: Check out VHD source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Retarget exporter to v120
        shell: powershell
        run: |
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.vcxproj' -File | ForEach-Object {
            $p=$_.FullName
            $t=[IO.File]::ReadAllText($p)
            $n=$t.Replace('<PlatformToolset>v120_xp</PlatformToolset>','<PlatformToolset>v120</PlatformToolset>')
            if($n-ne$t){[IO.File]::WriteAllText($p,$n,(New-Object Text.UTF8Encoding($false)))}
          }

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates=@(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $m=$candidates|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not $m){$cmd=Get-Command msbuild.exe -ErrorAction SilentlyContinue;if($cmd){$m=$cmd.Source}}
          if(-not $m){throw 'MSBuild not found.'}
          "path=$m"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build ja2export with dependencies
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2export /p:Configuration=Release /p:Platform=Win32
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $exe=Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\Release\ja2export.exe'
          if(-not(Test-Path $exe)){throw "ja2export missing: $exe"}

      - name: Fetch canonical C5 structural STI contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'C5Canonical'
          New-Item -ItemType Directory -Force -Path $source | Out-Null

          $targets=@(
            'Cobble_Road.sti',
            'Cobble_Road_Pieces.sti',
            'Pave_b.sti',
            'build_24.sti',
            'slant_12.sti'
          )

          $headers=@{'User-Agent'='JA2-Vengeance-C5-VHD2'}
          foreach($target in $targets){
            $apiName=[Uri]::EscapeDataString($target)
            $api="https://api.github.com/repos/mattedinburgh/vr_gamedir/contents/Data-Maps-Tiles/Tilesets/18/$apiName?ref=feature%2Fvhd-renderer-test"
            $meta=Invoke-RestMethod -Uri $api -Headers $headers
            if(-not $meta.download_url){throw "No download URL returned for $target"}
            $dst=Join-Path $source $target
            Invoke-WebRequest -Uri $meta.download_url -Headers $headers -OutFile $dst -UseBasicParsing
            if(-not(Test-Path $dst)){throw "Failed to download $target"}
            Write-Host "Canonical contract: $target ($((Get-Item $dst).Length) bytes)"
          }

      - name: Extract frame geometry and offsets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exporter=Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\Release\ja2export.exe'
          $source=Join-Path $env:GITHUB_WORKSPACE 'C5Canonical'
          $out=Join-Path $env:GITHUB_WORKSPACE 'C5Contracts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $targets=@(
            'Cobble_Road.sti',
            'Cobble_Road_Pieces.sti',
            'Pave_b.sti',
            'build_24.sti',
            'slant_12.sti'
          )

          $manifest=@()
          foreach($target in $targets){
            $stem=[IO.Path]::GetFileNameWithoutExtension($target).ToUpperInvariant()
            $src=Join-Path $source $target
            $targetOut=Join-Path $out $stem
            Remove-Item -LiteralPath $targetOut -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $targetOut | Out-Null

            & $exporter sti -unpack -offsets -rgba -create_dst $src $targetOut | Out-Host
            if($LASTEXITCODE-ne0){throw "ja2export failed for $target with exit code $LASTEXITCODE"}

            $frames=@(Get-ChildItem -LiteralPath $targetOut -Recurse -File -Filter '*.png' -ErrorAction SilentlyContinue)
            if($frames.Count -eq 0){throw "No frames extracted for $target"}

            $manifest += [pscustomobject]@{
              target=$target
              family=$stem
              source='mattedinburgh/vr_gamedir@feature/vhd-renderer-test'
              frame_count=$frames.Count
            }
            Write-Host "Contract $stem: $($frames.Count) frame(s)"
          }

          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $out 'contract_manifest.json')

      - name: Find Python and install Pillow
        id: python
        shell: powershell
        run: |
          $py=$null
          $cmd=Get-Command py.exe -ErrorAction SilentlyContinue
          if($cmd){$py="$($cmd.Source) -3"}
          if(-not $py){
            $cmd=Get-Command python.exe -ErrorAction SilentlyContinue
            if($cmd){$py=$cmd.Source}
          }
          if(-not $py){throw 'Python 3 not found on render PC.'}
          "cmd=$py"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          if($py -match ' -3$'){
            & ($py -replace ' -3$','') -3 -m pip install --user Pillow
          } else {
            & $py -m pip install --user Pillow
          }
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Generate scratch-authored native VHD2 pixels
        shell: powershell
        run: |
          $py='${{ steps.python.outputs.cmd }}'
          $script=Join-Path $env:GITHUB_WORKSPACE 'Tools\SanMonaC5\generate_vhd2_c5_pilot.py'
          $contracts=Join-Path $env:GITHUB_WORKSPACE 'C5Contracts'
          $out=Join-Path $env:GITHUB_WORKSPACE 'C5VHD2'

          if($py -match ' -3$'){
            $exe=$py -replace ' -3$',''
            & $exe -3 $script --extract-root $contracts --out-root $out
          } else {
            & $py $script --extract-root $contracts --out-root $out
          }
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $assets=@(Get-ChildItem -LiteralPath (Join-Path $out 'VHD2\TILESETS\18') -Filter '*.b1tc' -File)
          if($assets.Count -lt 5){throw "Expected five native VHD2 structural assets, generated $($assets.Count)."}
          Write-Host "Generated native VHD2 assets: $($assets.Name -join ', ')"

      - name: Upload native VHD2 pilot pack
        uses: actions/upload-artifact@v4
        with:
          name: san-mona-c5-vhd2-scratch-pilot
          path: |
            C5VHD2/
            C5Contracts/contract_manifest.json
          if-no-files-found: error
          retention-days: 14
