name: Port proven Map Factory to canonical branch

on:
  push:
    branches:
      - install/all-2026-09-12
    paths:
      - 'MapPreviewTrigger/PORT_MAP_FACTORY.txt'
      - '.github/workflows/port-map-factory.yml'
      - 'Tools/map_factory_v2_patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-factory-port
  cancel-in-progress: true

jobs:
  prepare-candidate:
    runs-on: windows-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: Check out current canonical branch
        uses: actions/checkout@v4
        with:
          ref: install/all-2026-09-12
          fetch-depth: 0

      - name: Transplant proven Map Factory snapshot without regressing A3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -B map-factory-v2-candidate origin/install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $factory = '3845808e1259c717b2d261d27387b2ce942fcc31'
          $a3v2 = '6f687b77ce7545eed68ff680f3e33ec23a082148'
          $a3v2Parent = '7e51dbf140fb207bbb6c7a5d290dd784aa85b6d7'
          $a3v3 = '549e5f109f0edd6b0172cea9198af7b6a661e626'
          $a3v3Parent = '308f91cd35aefb09b6b32cbed5a39d64f61eaa90'

          foreach ($sha in @($factory,$a3v2,$a3v2Parent,$a3v3,$a3v3Parent)) {
            git fetch origin $sha
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch required historical commit $sha" }
          }

          # Three files are strict supersets of the current canonical versions.
          # worlddef.cpp is also transplanted, then the two missing authored-A3
          # patches are replayed explicitly below.
          git checkout $factory -- Utils/MapUtility.cpp TileEngine/worlddef.cpp TileEngine/worlddef.h TileEngine/lighting.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'Transplant proven Map Factory engine snapshot'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Preserve the canonical authored A3 V2/V3 work that lives on the
          # opposite side of the historical branch divergence.
          cmd /c "git diff $a3v2Parent $a3v2 -- TileEngine/worlddef.cpp > a3-v2.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --3way --index a3-v2.patch
          if ($LASTEXITCODE -ne 0) {
            git status --short
            throw 'Could not replay authored A3 V2 over Map Factory snapshot.'
          }
          git commit -m 'Preserve authored A3 composition V2 in Map Factory'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmd /c "git diff $a3v3Parent $a3v3 -- TileEngine/worlddef.cpp > a3-v3.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --3way --index a3-v3.patch
          if ($LASTEXITCODE -ne 0) {
            git status --short
            throw 'Could not replay authored A3 V3 over Map Factory snapshot.'
          }
          git commit -m 'Preserve authored A3 composition V3 in Map Factory'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item -Force a3-v2.patch,a3-v3.patch -ErrorAction SilentlyContinue

      - name: Apply v2 authored-layout and readability refinement
        shell: powershell
        run: |
          python '.\Tools\map_factory_v2_patch.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git add Utils/MapUtility.cpp TileEngine/worlddef.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'Map Factory v2: authored layouts and readability-first colour'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify candidate touches only intended engine files
        shell: powershell
        run: |
          $files = @(git diff --name-only origin/install/all-2026-09-12...HEAD)
          $allowed = @(
            'Utils/MapUtility.cpp',
            'TileEngine/worlddef.cpp',
            'TileEngine/worlddef.h',
            'TileEngine/lighting.cpp'
          )
          $unexpected = @($files | Where-Object { $allowed -notcontains $_ })
          Write-Host 'Candidate files:'
          $files | ForEach-Object { Write-Host "  $_" }
          if ($unexpected.Count -gt 0) {
            throw "Unexpected files in Map Factory candidate: $($unexpected -join ', ')"
          }

      - name: Rebase candidate onto latest canonical head
        shell: powershell
        run: |
          git fetch origin install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/install/all-2026-09-12
          if ($LASTEXITCODE -ne 0) {
            git rebase --abort
            throw 'Canonical branch advanced incompatibly while preparing Map Factory candidate.'
          }

      - name: Publish disposable candidate for local compiler validation
        id: candidate
        shell: powershell
        run: |
          git push --force origin HEAD:map-factory-v2-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Prepared candidate: $sha"

  validate-and-promote:
    needs: prepare-candidate
    runs-on: [self-hosted, Windows, X64, ja2-render]
    timeout-minutes: 90

    steps:
      - name: Check out prepared candidate
        uses: actions/checkout@v4
        with:
          ref: map-factory-v2-candidate
          fetch-depth: 1

      - name: Locate Git on validation PC
        id: git
        shell: powershell
        run: |
          $git = $null
          $cmd = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($cmd) { $git = $cmd.Source }
          if (-not $git) {
            $git = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Recurse -Filter git.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\resources\\app\\git\\cmd\\git\.exe$' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $git -or -not (Test-Path $git)) { throw 'Git not found on validation PC.' }
          "path=$git" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          & $git --version

      - name: Retarget projects to installed v120 toolset
        shell: powershell
        run: |
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.vcxproj' -File | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            $newText = $text.Replace('<PlatformToolset>v120_xp</PlatformToolset>', '<PlatformToolset>v120</PlatformToolset>')
            if ($newText -ne $text) {
              [System.IO.File]::WriteAllText($path, $newText, (New-Object System.Text.UTF8Encoding($false)))
            }
          }

      - name: Find MSBuild
        id: msbuild
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw 'MSBuild not found on validation PC.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build candidate MapEditor
        shell: powershell
        run: |
          & '${{ steps.msbuild.outputs.path }}' '.\ja2_VS2013.sln' /m /t:ja2 /p:Configuration=MapEditor /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $editor = Join-Path $env:GITHUB_WORKSPACE 'bin\VS2013\MapEditor_EN_Release.exe'
          if (-not (Test-Path $editor)) { throw "MapEditor binary not produced: $editor" }

      - name: Promote only if canonical has not diverged
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $git = '${{ steps.git.outputs.path }}'
          $candidate = '${{ needs.prepare-candidate.outputs.candidate_sha }}'
          $promote = Join-Path $env:RUNNER_TEMP 'map-factory-promote'
          if (Test-Path $promote) { Remove-Item -Recurse -Force $promote }
          New-Item -ItemType Directory -Force -Path $promote | Out-Null

          & $git -C $promote init
          & $git -C $promote remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/mattedinburgh/vr_source.git"
          & $git -C $promote fetch origin install/all-2026-09-12 map-factory-v2-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $remoteCandidate = (& $git -C $promote rev-parse 'origin/map-factory-v2-candidate').Trim()
          if ($remoteCandidate -ne $candidate) {
            throw "Candidate moved during validation: expected $candidate got $remoteCandidate"
          }

          & $git -C $promote merge-base --is-ancestor 'origin/install/all-2026-09-12' 'origin/map-factory-v2-candidate'
          if ($LASTEXITCODE -ne 0) {
            throw 'Canonical branch advanced after candidate preparation. Refusing stale promotion; rerun the port.'
          }

          & $git -C $promote push origin 'refs/remotes/origin/map-factory-v2-candidate:refs/heads/install/all-2026-09-12'
          if ($LASTEXITCODE -ne 0) { throw 'Validated candidate could not be promoted to canonical branch.' }

          & $git -C $promote push origin --delete map-factory-v2-candidate
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Validated candidate was promoted, but temporary candidate branch could not be deleted.'
            $global:LASTEXITCODE = 0
          }
